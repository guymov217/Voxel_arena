name: Builds

# Builds the C++ voxel core, tests the game, exports it for Windows, Linux and macOS and packs it (tools/package.py):
# for Steam (depots + SteamPipe scripts) and as downloads for people without Steam. Run it from the Actions tab
# (or push a tag like v0.1); the packages are attached to the run as downloads.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  GODOT_VERSION: 4.7.2

jobs:
  # The C++ voxel core (extension/): Linux and Windows (MinGW) on Ubuntu, a universal library on macOS.
  native:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platforms: linux windows
          - os: macos-latest
            platforms: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        working-directory: extension
        run: |
          pip install scons==4.8.1
          git clone -b 4.4 --depth 1 https://github.com/godotengine/godot-cpp
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64; fi
          for p in ${{ matrix.platforms }}; do
            extra=""; [ "$p" = "windows" ] && extra="use_mingw=yes"
            [ "$p" = "macos" ] && extra="arch=universal"
            scons -j4 platform=$p target=template_release $extra
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: native/bin/

  export:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native/bin/
          merge-multiple: true
      - name: Load the native library (it is built for every platform here)
        run: cp native/voxel_core.gdextension.in native/voxel_core.gdextension
      - name: Install Godot and the export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSLo godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          curl -sSLo templates.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $dir && unzip -q templates.tpz && mv templates/* $dir/
      - name: Import and test
        run: |
          godot --headless --path . --import || true
          GODOT=/usr/local/bin/godot sh run_tests.sh
      - name: GodotSteam for the Steam builds (optional)
        # Set the repository variable GODOTSTEAM_URL to the address of the GodotSteam GDExtension zip; without it the
        # Steam builds are made with no Steam library (they run, but without the overlay, lobbies or achievements).
        if: ${{ vars.GODOTSTEAM_URL != '' }}
        env:
          GODOTSTEAM_URL: ${{ vars.GODOTSTEAM_URL }}
        run: |
          curl -sSLo godotsteam.zip "$GODOTSTEAM_URL"
          echo "GODOTSTEAM_ZIP=$PWD/godotsteam.zip" >> "$GITHUB_ENV"
      - name: Install NSIS (the Windows installer)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Package
        # Exports the full game and the demo for Windows, Linux and macOS, and packs them: dist/steam (the depots and the
        # SteamPipe scripts) and dist/standalone (zip, tar.gz, installer: for people without Steam). docs/PACKAGING.md.
        run: |
          args=""
          [ -n "$GODOTSTEAM_ZIP" ] && args="--godotsteam $GODOTSTEAM_ZIP"
          python3 tools/package.py --clean --godot /usr/local/bin/godot $args
          cat dist/PACKAGE_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: wrecksmith-steam
          path: dist/steam/
      - uses: actions/upload-artifact@v4
        with:
          name: wrecksmith-standalone
          path: dist/standalone/
      - uses: actions/upload-artifact@v4
        with:
          name: package-report
          path: dist/PACKAGE_REPORT.md
