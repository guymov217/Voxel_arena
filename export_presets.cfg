[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features="steam"
export_filter="all_resources"
include_filter="data/*.json, art/CREDITS.md, art/fonts/OFL-*.txt"
exclude_filter="tests/*, build/*, dist/*, extension/*, docs/*, art/icon/*, tools/*.py, tools/*.bat, tools/*.sh, tools/*.md, tools/steam/*, tools/installer/*"
export_path="build/steam/full/windows/WRECKSMITH.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/modify_resources=true
application/icon="res://art/icon/wrecksmith.ico"
application/file_version="1.0.0.0"
application/product_version="1.0.0.0"
application/company_name="Edella Studios"
application/product_name="WRECKSMITH"
application/file_description="WRECKSMITH"
application/copyright="Copyright (c) 2026 Edella Studios"
application/trademarks=""

